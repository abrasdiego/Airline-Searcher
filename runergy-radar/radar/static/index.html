<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Runergy Radar</title>
<link rel="icon" type="image/png" href="/logo-64.png">
<link rel="apple-touch-icon" href="/logo-192.png">
<meta name="theme-color" content="#04141a">
<style>
:root {
  /* Runergy Lab: deep teal-black with the green-to-cyan of the logo */
  --bg: #030f14; --surface: #0a1e25; --raised: #0e262e; --sunken: #06171d; --ink: #eaf6f2; --ink-2: #c3d6d2;
  --muted: #86a19e; --line: #153037; --line-2: #1f444c;
  --accent: #2df59a; --accent-2: #12dcd6; --accent-3: #8cfb6a; --accent-ink: #01231a; --accent-soft: rgba(45,245,154,.11);
  --good: #3ef59a; --warn: #f2c14e; --warn-soft: rgba(242,193,78,.1); --bad: #ff8577; --bad-soft: rgba(255,133,119,.1);
  --reddit: #ff7a4d; --threads: #d9e6e3; --web: #4fd8e8;
  --brand: linear-gradient(100deg, var(--accent-3), var(--accent) 45%, var(--accent-2));
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.28);
  --glow: 0 0 0 1px rgba(45,245,154,.35), 0 8px 28px rgba(18,220,214,.16);
  --radius: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f1f6f4; --surface: #ffffff; --raised: #ffffff; --sunken: #eaf1ee; --ink: #06222a; --ink-2: #24424a;
    --muted: #587471; --line: #d9e5e1; --line-2: #bfd2cd;
    --accent: #067a58; --accent-2: #0a8a91; --accent-3: #23913a; --accent-ink: #ffffff; --accent-soft: rgba(6,122,88,.09);
    --good: #067a58; --warn: #8f6200; --warn-soft: rgba(143,98,0,.09); --bad: #bf3526; --bad-soft: rgba(191,53,38,.08);
    --reddit: #d93a00; --threads: #06222a; --web: #0b7285;
    --brand: linear-gradient(100deg, #1f8a35, #067a58 45%, #0a8a91);
    --shadow: 0 1px 2px rgba(6,34,42,.05), 0 8px 24px rgba(6,34,42,.06);
    --glow: 0 0 0 1px rgba(6,122,88,.45), 0 8px 24px rgba(6,122,88,.12);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-image: radial-gradient(900px 480px at 100% -120px, color-mix(in srgb, var(--accent-2) 15%, transparent), transparent 70%),
                    radial-gradient(700px 420px at -10% 110%, color-mix(in srgb, var(--accent-3) 7%, transparent), transparent 70%);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
kbd { font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 3px 5px; border-radius: 5px;
  border: 1px solid var(--line-2); background: var(--sunken); color: var(--muted); }

/* ---- shell ---- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 20px 14px;
  border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(10px); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; padding: 0 8px 18px; }
.logo img { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 4px 18px rgba(18,220,214,.25); }
.logo span { line-height: 1.15; }
.logo small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 11px; border: 0; border-radius: 10px;
  background: none; color: var(--muted); font-weight: 600; cursor: pointer; text-align: left; }
.nav-item:hover { color: var(--ink); background: var(--sunken); }
.nav-item[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.nav-item[aria-current="page"] svg { color: var(--accent); }
.nav-item .n { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; font-size: 12px; text-align: center;
  background: var(--brand); color: var(--accent-ink); }
.nav-item .alert { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.side .grow { flex: 1; }
.scanbox { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); }
.scanbox .when { font-size: 12px; color: var(--muted); margin-bottom: 9px; display: flex; align-items: center; gap: 7px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation: pulse 2.4s infinite; }
.pulse.off { background: var(--muted); animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.side .foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px 0; font-size: 12px; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: inherit; }
.linkbtn:hover { color: var(--ink); }
.content { min-width: 0; }
main { padding: 28px 32px 90px; min-width: 0; max-width: 1500px; }
.mobile-top, .tabbar { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 7px 14px;
  border-radius: 11px; border: 1px solid var(--line-2); background: var(--raised); cursor: pointer; font-weight: 600;
  text-decoration: none; white-space: nowrap; transition: transform .06s ease, border-color .15s, filter .15s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--brand); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 22px rgba(18,220,214,.18); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); background: var(--sunken); }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 13px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btn kbd { background: rgba(0,0,0,.14); border-color: rgba(0,0,0,.18); color: inherit; opacity: .8; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.025em; margin: 0 0 4px; }
h2 { font-size: 16px; letter-spacing: -.01em; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
.grad { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---- stat tiles ---- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.lead { border-color: transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--brand) border-box; }

/* ---- setup ---- */
.setup { border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
.setup { padding: 0; }
.setup summary { display: flex; align-items: center; gap: 14px; padding: 13px 18px; cursor: pointer; list-style: none; }
.setup summary::-webkit-details-marker { display: none; }
.setup summary h2 { margin: 0; white-space: nowrap; }
.setup summary .bar { flex: 1; margin: 0; min-width: 40px; }
.setup summary span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.setup summary .more { text-decoration: underline; }
.setup[open] summary .more { display: none; }
.setup .steps-box { padding: 0 18px 12px; }
.bar { height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; margin: 8px 0 12px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.step { display: flex; gap: 11px; padding: 7px 0; align-items: flex-start; }
.step .tick { width: 20px; height: 20px; border-radius: 50%; flex: none; margin-top: 1px; display: grid; place-items: center; border: 1.5px solid var(--line-2); color: transparent; }
.step.done .tick { background: var(--brand); border-color: transparent; color: var(--accent-ink); }
.step .tick svg { width: 12px; height: 12px; stroke-width: 3; }
.step b { font-weight: 600; }
.step.done b { color: var(--muted); font-weight: 500; }
.step small { display: block; color: var(--muted); font-size: 13px; }
.setup.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }

/* ---- inbox toolbar ---- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--sunken); border: 1px solid var(--line); max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.seg .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button[aria-selected="true"] .c.hot { background: var(--brand); color: var(--accent-ink); padding: 0 6px; border-radius: 999px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1; min-width: 0; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip:hover { color: var(--ink); border-color: var(--line-2); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.filters select, .searchbox { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 5px 9px; min-height: 34px; font-size: 13px; }
.searchbox { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 130px; color: var(--muted); }
.searchbox input { border: 0; background: none; outline: none; flex: 1; min-width: 0; color: var(--ink); }
.searchbox:focus-within { border-color: var(--accent); }

/* ---- split inbox ---- */
.split { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { position: relative; display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 14px; padding: 12px 14px 12px 18px; cursor: pointer; transition: border-color .15s, transform .08s; }
.item::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--line-2); }
.item.high::before { background: var(--good); } .item.mid::before { background: var(--warn); }
.item:hover { border-color: var(--line-2); }
.item[aria-current="true"] { border-color: transparent; background: linear-gradient(var(--raised), var(--raised)) padding-box, var(--brand) border-box; box-shadow: var(--glow); }
.item .top { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.item .top .num { margin-left: auto; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.item .t { font-weight: 600; line-height: 1.35; margin: 4px 0 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .s { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item .flag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; margin-top: 6px; color: var(--muted); }
.item .flag svg { width: 13px; height: 13px; color: var(--accent); }
.pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pdot.reddit { background: var(--reddit); } .pdot.threads { background: var(--threads); } .pdot.web { background: var(--web); }

.detail { position: sticky; top: 20px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow);
  padding: 22px 24px; max-height: calc(100vh - 40px); overflow-y: auto; }
.detail .back { display: none; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); }
.score { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.score b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.meter { width: 64px; height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--muted); }
.meter.high i { background: var(--good); } .meter.mid i { background: var(--warn); }
.detail h3 { font-size: 21px; line-height: 1.3; margin: 12px 0 8px; letter-spacing: -.02em; }
.detail h3 a { text-decoration: none; }
.detail h3 a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.snippet { margin: 0; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.snippet.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.tag.t { background: var(--accent-soft); color: var(--ink); border-color: transparent; font-weight: 600; }
.why { display: flex; gap: 10px; margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--sunken); font-size: 13.5px; color: var(--ink-2); }
.why svg { color: var(--accent); margin-top: 1px; }
.reply { margin-top: 18px; }
.reply-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
.reply-head .hint { font-weight: 500; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.reply-head .hint.over { color: var(--bad); font-weight: 700; }
textarea.draft { display: block; width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--line); border-radius: 14px;
  padding: 13px 15px; background: var(--sunken); line-height: 1.55; transition: border-color .15s, box-shadow .15s; }
textarea.draft:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.underline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.linkstate { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); max-width: 100%; }
.linkstate span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkstate.in { color: var(--ink-2); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.linkstate svg { width: 14px; height: 14px; }
button.linkstate { background: none; cursor: pointer; }
button.linkstate:hover { color: var(--ink); border-color: var(--line-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.actions .right { margin-left: auto; display: flex; gap: 2px; }
.inline-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
.inline-note.bad { color: var(--bad); }
.tweak { display: flex; gap: 8px; margin-top: 10px; }
.tweak input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; background: var(--sunken); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 14px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.confirm span { flex: 1; min-width: 180px; }
.posted { padding: 12px 14px; border-radius: 14px; background: var(--sunken); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.empty { text-align: center; padding: 56px 16px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 20px; }
.empty .orb { width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty .orb svg { width: 26px; height: 26px; }
.empty h2 { color: var(--ink); font-size: 18px; }
.empty p { margin: 4px auto 0; max-width: 46ch; }
.empty .btn { margin-top: 14px; }
.center { display: flex; justify-content: center; margin: 6px 0; }

/* ---- panels (sources, settings) ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); scroll-margin-top: 20px; }
.panel > p.help, p.help { color: var(--muted); margin: 0 0 14px; font-size: 14px; max-width: 75ch; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.error { background: var(--bad); } .dot.waiting { background: var(--warn); }
.row .growx { flex: 1; min-width: 0; }
.row .name { font-weight: 600; }
.small { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.small.bad { color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--ink-2); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok::before { background: var(--good); } .pill.error::before { background: var(--bad); } .pill.waiting::before { background: var(--warn); }

.settings { display: grid; grid-template-columns: 190px minmax(0, 760px); gap: 28px; align-items: start; }
.toc { position: sticky; top: 28px; display: flex; flex-direction: column; gap: 2px; }
.toc a { padding: 7px 10px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
.toc a:hover { color: var(--ink); background: var(--sunken); }
label.field { display: block; margin-bottom: 16px; }
label.field > span { display: block; font-weight: 600; margin-bottom: 4px; }
label.field > small { display: block; color: var(--muted); margin-bottom: 6px; font-size: 13px; }
.field input[type=text], .field input[type=url], .field input[type=number], .field input[type=password], .field textarea, .inp {
  width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; background: var(--sunken); transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field textarea:focus, .inp:focus, .topic textarea:focus, .topic-head input:focus, .feed-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
.field input[type=number] { max-width: 130px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.choice { position: relative; display: block; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; background: var(--sunken); }
.choice input { position: absolute; opacity: 0; }
.choice b { display: block; margin-bottom: 2px; }
.choice small { color: var(--muted); font-size: 13px; display: block; line-height: 1.4; }
.choice:has(input:checked) { border-color: transparent; background: linear-gradient(var(--raised), var(--raised)) padding-box, var(--brand) border-box; box-shadow: var(--glow); }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.preview { border: 1px dashed var(--line-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.preview div { margin: 2px 0; } .preview b { color: var(--ink-2); font-weight: 600; }
.topic { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; background: var(--sunken); }
.topic-head { display: flex; gap: 8px; margin-bottom: 8px; }
.topic-head input { flex: 1; min-width: 0; font-weight: 600; border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; background: var(--surface); }
.topic textarea { width: 100%; min-height: 128px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--surface); resize: vertical; line-height: 1.5; }
.feed-row { display: flex; gap: 8px; margin-bottom: 8px; }
.feed-row input { border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; background: var(--sunken); min-width: 0; }
.feed-row input.fname { flex: 0 0 30%; } .feed-row input.furl { flex: 1; }
.check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; font-weight: 600; cursor: pointer; }
.check input { width: 17px; height: 17px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.check small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.savebar { position: sticky; bottom: 14px; display: flex; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 16px;
  border: 1px solid var(--line-2); background: color-mix(in srgb, var(--raised) 92%, transparent); backdrop-filter: blur(10px); box-shadow: 0 12px 34px rgba(0,0,0,.3); }
ol.steps { margin: 0 0 14px; padding-left: 20px; color: var(--muted); font-size: 14px; }
ol.steps li { margin: 4px 0; }

/* ---- sign in ---- */
.login { max-width: 380px; margin: 0 auto; padding: 14vh 16px 0; }
.login .panel { padding: 30px; border-radius: 22px; }
.login .logo { font-size: 19px; padding: 0 0 8px; }
.login .logo img { width: 48px; height: 48px; border-radius: 13px; }
.tagline { margin: 0 0 20px; font-weight: 600; }

/* ---- overlays ---- */
#toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 540px); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); padding: 10px 15px; border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.4);
  display: flex; gap: 14px; align-items: center; max-width: 100%; font-size: 14px; font-weight: 500; animation: rise .18s ease; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.toast.bad { background: #c0392b; color: #fff; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
.scrim { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.sheet { width: min(100%, 420px); background: var(--raised); border: 1px solid var(--line-2); border-radius: 20px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; margin: 14px 0 18px; align-items: center; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 1080px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .mobile-top { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
  .mobile-top .logo { padding: 0; flex: 1; }
  .mobile-top .logo img { width: 32px; height: 32px; }
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); }
  .tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; border-radius: 10px; }
  .tabbar button[aria-current="page"] { color: var(--ink); }
  .tabbar button[aria-current="page"] svg { color: var(--accent); }
  .tabbar .n { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; padding: 0 5px; border-radius: 999px; font-size: 10.5px; background: var(--brand); color: var(--accent-ink); }
  main { padding: 18px 16px 96px; }
  #toasts { bottom: 80px; }
  .settings { grid-template-columns: 1fr; } .toc { display: none; }
  .split { grid-template-columns: 1fr; }
  .split .detail { display: none; }
  .split.open .list { display: none; }
  .split.open .detail { display: block; position: static; max-height: none; padding: 18px 16px; }
  .detail .back { display: inline-flex; margin: -4px 0 10px -8px; }
  body.reading .kpis, body.reading .page-head, body.reading .toolbar, body.reading .setup { display: none; }
  .savebar { bottom: 76px; }
}
@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .setup summary h2 { font-size: 15px; } .setup summary .more { display: none; }
  .filters select { flex: 1; min-width: 0; }
  .kpi .value { font-size: 24px; }
  .grid2, .choices { grid-template-columns: 1fr; }
  .actions .btn.primary { width: 100%; }
  .actions .right { margin-left: 0; }
  .feed-row { flex-wrap: wrap; } .feed-row input.fname { flex: 1 1 100%; }
  .btn kbd { display: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";
(function () {
  const TABS = [["new", "To reply"], ["saved", "Saved"], ["replied", "Replied"], ["dismissed", "Dismissed"], ["filtered", "Low relevance"]];
  const PLATFORMS = { reddit: "Reddit", threads: "Threads", web: "Forums & web" };
  const LOGO = '<img src="/logo-64.png" srcset="/logo-192.png 3x" alt=""><span>Runergy Radar<small>by Runergy Lab</small></span>';
  const ICONS = {
    inbox: '<path d="M4 13l2.2-7.2A2 2 0 0 1 8.1 4.4h7.8a2 2 0 0 1 1.9 1.4L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/>',
    signal: '<circle cx="12" cy="12" r="2"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 19.1a10 10 0 0 1 0-14.2M19.1 4.9a10 10 0 0 1 0 14.2"/>',
    sliders: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
    refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.3L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.3 4.3L20 15.5M20 20v-4.5h-4.5"/>',
    out: '<path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    spark: '<path d="M12 4l1.8 4.7L18.5 10l-4.7 1.6L12 16l-1.8-4.4L5.5 10l4.7-1.3zM18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    pen: '<path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z"/>',
    done: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.4 2.4 4.6-5"/>'
  };
  const S = { view: "inbox", tab: "new", platform: "", topic: "", sort: "", q: "", app: null, threads: [], total: 0,
              platforms: {}, settings: null, dirty: false, scanning: false, login: false, lock: "", selected: null, open: false, help: false };
  const root = document.getElementById("app");
  const wide = () => window.matchMedia("(min-width: 1081px)").matches;

  // ---- helpers ---------------------------------------------------------------------------------
  function h(tag, attrs) {

      else if (value === true) el.setAttribute(key, "");

    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);

  }
  function add(el, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) return child.forEach(c => add(el, c));
    el.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  function icon(name) {
    const span = document.createElement("span");
    span.innerHTML = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + "</svg>";

  }
  function safeUrl(url) {
    try { const u = new URL(url); return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "#"; }
    catch (e) { return "#"; }
  }
  function ago(stampText) {
    if (!stampText) return "";
    const seconds = Math.max(0, (Date.now() - new Date(stampText).getTime()) / 1000);
    if (seconds < 90) return "just now";
    if (seconds < 3600) return Math.round(seconds / 60) + " min ago";
    if (seconds < 86400) return Math.round(seconds / 3600) + "h ago";
    const days = Math.round(seconds / 86400);
    return days === 1 ? "yesterday" : days + " days ago";
  }
  const plural = (n, word, many) => n + " " + (n === 1 ? word : (many || word + "s"));
  const band = score => score >= 75 ? "high" : score >= 50 ? "mid" : "low";
  function toast(message, options) {
    options = options || {};
    const box = h("div", { class: "toast" + (options.bad ? " bad" : "") }, h("span", { text: message }));
    if (options.action) box.append(h("button", { text: options.label || "Undo", onclick: () => { box.remove(); options.action(); } }));
    document.getElementById("toasts").append(box);
    setTimeout(() => box.remove(), options.bad ? 9000 : 6000);
  }
  async function api(path, body) {
    let response;
    try {
      response = await fetch(path, body === undefined ? { credentials: "same-origin" } : {
        method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    } catch (e) { throw new Error("Can't reach Runergy Radar. Check your connection and try again."); }
    let data = {};
    try { data = await response.json(); } catch (e) { /* not JSON */ }
    if (response.status === 401 && path !== "/api/login") { S.login = true; S.lock = ""; render(); throw new Error("Please sign in."); }
    if (response.status === 503 && data.password_set === false) { S.lock = data.error; render(); throw new Error(data.error); }
    if (!response.ok) throw new Error(data.error || "Something went wrong (" + response.status + ").");
    return data;
  }
  function fail(error) { toast(error.message || String(error), { bad: true }); }
  function copyText(text) {
    const area = h("textarea", { style: "position:fixed;top:-1000px;opacity:0" });
    area.value = text;
    document.body.append(area);
    area.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    area.remove();
    if (!done && navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); done = true; }
    return done;
  }
  function debounce(fn, wait) { let timer; return function (event) { clearTimeout(timer); timer = setTimeout(() => fn(event), wait); }; }

  // ---- data --------------------------------------------------------------------------------------
  async function loadState() {
    S.app = await api("/api/state");
    S.login = false;
    const waiting = S.app.counts.new;
    document.title = (waiting ? "(" + waiting + ") " : "") + "Runergy Radar";
  }
  async function loadThreads(append) {
    const params = new URLSearchParams({ status: S.tab, offset: append ? S.threads.length : 0 });
    if (S.platform) params.set("platform", S.platform);
    if (S.topic) params.set("topic", S.topic);
    if (S.sort) params.set("sort", S.sort);
    if (S.q) params.set("q", S.q);
    const data = await api("/api/threads?" + params);
    S.threads = append ? S.threads.concat(data.threads) : data.threads;
    S.total = data.total;
    S.platforms = data.platforms;
    if (!S.threads.some(t => t.id === S.selected)) { S.selected = S.threads.length ? S.threads[0].id : null; S.open = false; }
  }
  async function refresh() {
    try { await loadState(); if (S.view === "inbox") await loadThreads(false); render(); }
    catch (e) { if (!S.login && !S.lock) fail(e); }
  }
  const current = () => S.threads.find(t => t.id === S.selected) || null;

  // ---- shell --------------------------------------------------------------------------------------
  const NAV = [["inbox", "Inbox", "inbox"], ["sources", "Sources", "signal"], ["settings", "Settings", "sliders"]];
  function navBadge(key) {
    if (key === "inbox" && S.app.counts.new) return h("span", { class: "n", text: S.app.counts.new });
    if (key === "sources" && S.app.sources.some(s => s.state === "error")) return h("span", { class: "alert", title: "A source has a problem" });
    return null;
  }
  function scanButton(small) {
    return h("button", { class: "btn primary" + (small ? " small" : " wide"), disabled: S.scanning, onclick: scanNow },
      S.scanning ? h("span", { class: "spin" }) : icon("refresh"), S.scanning ? "Scanning…" : "Scan now");
  }
  function shell(view) {
    const scan = S.app.last_scan;
    const side = h("aside", { class: "side" },
      h("div", { class: "logo", html: LOGO }),
      h("nav", { "aria-label": "Sections" }, NAV.map(([key, name, ic]) =>
        h("button", { class: "nav-item", "aria-current": S.view === key ? "page" : null, onclick: () => go(key) }, icon(ic), name, navBadge(key)))),
      h("div", { class: "grow" }),
      h("div", { class: "scanbox" },
        h("div", { class: "when" }, h("span", { class: "pulse" + (scan ? "" : " off") }), scan ? "Last scan " + ago(scan.at) : "Not scanned yet"),
        scanButton(false)),
      h("div", { class: "foot" },
        h("button", { class: "linkbtn", text: "Shortcuts", onclick: () => { S.help = true; render(); } }),
        S.app.password_set ? h("button", { class: "linkbtn", text: "Sign out", onclick: signOut }) : null));
    const top = h("header", { class: "mobile-top" }, h("div", { class: "logo", html: LOGO }), scanButton(true));
    const bar = h("nav", { class: "tabbar", "aria-label": "Sections" }, NAV.map(([key, name, ic]) =>
      h("button", { "aria-current": S.view === key ? "page" : null, onclick: () => go(key) }, icon(ic), name,
        key === "inbox" && S.app.counts.new ? h("span", { class: "n", text: S.app.counts.new }) : null)));
    return h("div", { class: "shell" }, side, h("div", { class: "content" }, top, h("main", {}, view)), bar);
  }
  async function go(view) {
    if (S.view === "settings" && S.dirty && view !== "settings" && !confirm("You have unsaved changes in Settings. Leave without saving?")) return;
    S.dirty = false; S.view = view; S.open = false;
    if (view === "settings") { S.settings = null; render(); try { S.settings = (await api("/api/settings")).settings; } catch (e) { fail(e); } }
    else if (view === "inbox") { try { await loadThreads(false); } catch (e) { fail(e); } }
    else { try { await loadState(); } catch (e) { fail(e); } }
    render();
    window.scrollTo(0, 0);
  }
  async function scanNow() {
    if (S.scanning) return;
    S.scanning = true; render();
    try {
      const scan = (await api("/api/scan", {})).scan;
      let message = scan.new ? plural(scan.new, "new conversation") + " found" : "Nothing new this time";
      if (scan.drafted) message += ", " + plural(scan.drafted, "reply", "replies") + " drafted";
      toast(message + ".");
      if (scan.errors.length) toast(scan.errors[0], { bad: true });
    } catch (e) { fail(e); }
    S.scanning = false;
    await refresh();
  }
  async function signOut() {
    try { await api("/api/logout", {}); } catch (e) { /* ignore */ }
    S.login = true; S.app = null; render();
  }

  // ---- inbox --------------------------------------------------------------------------------------
  function kpis() {
    const scan = S.app.last_scan, c = S.app.counts;
    const tile = (label, value, note, lead) => h("div", { class: "kpi" + (lead ? " lead" : "") },
      h("div", { class: "label", text: label }), h("div", { class: "value", text: value }), h("div", { class: "note", text: note }));
    return h("div", { class: "kpis" },
      tile("Waiting for a reply", c.new, c.saved ? c.saved + " saved for later" : "Best matches first", true),
      tile("Replied this week", S.app.replied_this_week, plural(c.replied, "reply", "replies") + " all time"),
      tile("Found in last scan", scan ? scan.new : "–", scan ? plural(scan.drafted, "reply", "replies") + " drafted" : "No scan yet"),
      tile("Filtered out for you", c.filtered, "Low relevance, kept just in case"));
  }
  function setupCard() {
    const items = S.app.setup, done = items.filter(i => i.ok).length;
    if (done === items.length) return null;
    const database = items.find(i => i.key === "database" && !i.ok);
    return h("details", { class: "setup" + (database ? " bad" : ""), open: Boolean(database) || !S.app.last_scan },
      h("summary", {}, h("h2", { text: database ? "Not ready yet: nothing will be saved" : "Finish setting up" }),
        h("div", { class: "bar" }, h("i", { style: "width:" + Math.round(done / items.length * 100) + "%" })),
        h("span", { text: done + " of " + items.length + " done" }), h("span", { class: "more", text: "Show steps" })),
      h("div", { class: "steps-box" }, items.map(item => h("div", { class: "step" + (item.ok ? " done" : "") }, h("span", { class: "tick" }, icon("check")),
        h("div", {}, h("b", { text: item.name }), item.ok ? null : h("small", { text: item.help }))))));
  }
  function inboxView() {
    const counts = S.app.counts;
    const tabs = h("div", { class: "seg", role: "tablist" }, TABS.map(([key, name]) =>
      h("button", { role: "tab", "aria-selected": S.tab === key ? "true" : "false", onclick: () => { S.tab = key; S.platform = ""; S.selected = null; reloadThreads(); } },
        name, h("span", { class: "c" + (key === "new" && counts.new ? " hot" : ""), text: counts[key] || 0 }))));
    const chips = [h("button", { class: "chip", "aria-pressed": S.platform === "" ? "true" : "false", onclick: () => { S.platform = ""; reloadThreads(); }, text: "All" })];
    Object.keys(PLATFORMS).forEach(key => {
      if (!S.platforms[key] && S.platform !== key) return;
      chips.push(h("button", { class: "chip", "aria-pressed": S.platform === key ? "true" : "false",
        onclick: () => { S.platform = key; reloadThreads(); }, text: PLATFORMS[key] + " " + (S.platforms[key] || 0) }));
    });
    const topic = h("select", { "aria-label": "Topic", onchange: e => { S.topic = e.target.value; reloadThreads(); } },
      h("option", { value: "", text: "All topics" }), S.app.topics.map(name => h("option", { value: name, selected: S.topic === name, text: name })));
    const sort = h("select", { "aria-label": "Sort", onchange: e => { S.sort = e.target.value; reloadThreads(); } },
      [["", "Best match first"], ["newest", "Newest first"]].map(([value, name]) => h("option", { value, selected: S.sort === value, text: name })));
    const search = h("input", { type: "search", id: "search", placeholder: "Search", value: S.q, "aria-label": "Search conversations",
      oninput: debounce(e => { S.q = e.target.value.trim(); reloadThreads(true); }, 350) });

    let body;
    if (!S.threads.length) body = emptyState();
    else {
      const list = h("div", { class: "list", id: "list" }, S.threads.map(listItem));
      if (S.threads.length < S.total) list.append(h("div", { class: "center" }, h("button", { class: "btn small",
        text: "Show more (" + (S.total - S.threads.length) + " left)",
        onclick: async e => { e.target.disabled = true; try { await loadThreads(true); } catch (err) { fail(err); } render(); } })));
      const detail = h("section", { class: "detail", id: "detail", "aria-label": "Conversation" });
      const thread = current();
      if (thread) drawDetail(detail, thread, {});
      body = h("div", { class: "split" + (S.open ? " open" : "") }, list, detail);
    }
    document.body.classList.toggle("reading", S.open && !wide());
    return h("div", {},
      h("div", { class: "page-head" },
        h("h1", {}, counts.new ? h("span", { class: "grad", text: counts.new }) : null,
          counts.new ? (counts.new === 1 ? " conversation is" : " conversations are") + " waiting for you" : "You're all caught up"),
        h("p", { class: "sub", text: "Radar finds the conversation and drafts the reply. You review it and post it yourself, so every reply is really yours." })),
      kpis(), setupCard(),
      h("div", { class: "toolbar" }, tabs, h("div", { class: "filters" }, chips, topic, sort, h("label", { class: "searchbox" }, icon("search"), search))),
      body);
  }
  function emptyState() {
    const box = (ic, title, text, button) => h("div", { class: "empty" }, h("div", { class: "orb" }, icon(ic)), h("h2", { text: title }), h("p", { text }), button || null);
    if (S.platform || S.topic || S.q) return box("search", "Nothing matches these filters", "Try a different search or clear the filters.",
      h("button", { class: "btn", text: "Clear filters", onclick: () => { S.platform = S.topic = S.q = ""; reloadThreads(); } }));
    if (S.tab === "new" && !S.app.last_scan) return box("signal", "Ready when you are",
      "Run your first scan to look for runners talking about your topics.", h("button", { class: "btn primary", onclick: scanNow }, icon("refresh"), "Scan now"));
    const messages = { new: ["done", "You're all caught up", "New conversations appear here after each scan."],
      saved: ["inbox", "Nothing saved", "Save a conversation to come back to it later."],
      replied: ["pen", "No replies yet", "Conversations you've replied to are kept here."],
      dismissed: ["inbox", "Nothing dismissed", "Conversations you skip are kept here in case you change your mind."],
      filtered: ["spark", "Nothing filtered out", "Conversations the AI judges a poor fit land here, so nothing is ever lost."] };
    return box.apply(null, messages[S.tab]);
  }
  async function reloadThreads(keepFocus) {

          h("li", { text: "Choose Show options, then set Deliver to: RSS feed, and How often: As-it-happens." }),
          h("li", { text: "Create the alert, right-click the feed icon next to it, copy the link, and paste it here." })),
        feeds),

      h("div", { class: "panel", id: "s-limits" }, h("h2", { text: "Filters and limits" }),
        field("A conversation must be about running", "At least one of these words must appear. Comma or new line between words.", textArea(s.context_words.join(", "), v => s.context_words = lines(v))),
        field("Skip conversations containing", "", textArea(s.exclude_words.join(", "), v => s.exclude_words = lines(v))),
        h("div", { class: "grid2" },
          field("Ignore conversations older than (days)", "", textInput(s.max_age_days, v => s.max_age_days = v, "number", { min: 1, max: 30 })),
          field("Google searches per day", "Each uses a SerpApi credit. 0 turns search off.", textInput(s.serpapi_daily_budget, v => s.serpapi_daily_budget = v, "number", { min: 0, max: 2000 })),
          field("AI drafts per scan", "", textInput(s.ai.drafts_per_scan, v => s.ai.drafts_per_scan = v, "number", { min: 0, max: 40 })),
          field("Hide conversations the AI scores below", "They go to Low relevance, never deleted.", textInput(s.ai.min_relevance, v => s.ai.min_relevance = v, "number", { min: 0, max: 100 }))),
        h("label", { class: "check" }, h("input", { type: "checkbox", checked: s.ai.enabled, onchange: e => { s.ai.enabled = e.target.checked; dirty(); } }), h("span", { text: "Let the AI score conversations and draft replies" })),
        h("label", { class: "check" }, h("input", { type: "checkbox", checked: s.threads_enabled, onchange: e => { s.threads_enabled = e.target.checked; dirty(); } }), h("span", { text: "Search Threads directly (when a Threads token is connected)" }))),

      h("div", { class: "savebar" }, h("button", { class: "btn primary", onclick: saveSettings }, icon("check"), "Save settings"),
        h("span", { class: "small", id: "savestate", text: S.dirty ? "Unsaved changes" : "All changes saved" })));

    return h("div", {}, h("h1", { text: "Settings" }), h("p", { class: "sub", text: "What to listen for, where to look, how your replies sound, and where they send people." }),
      h("div", { class: "settings" }, toc, form));
  }
  async function saveSettings(event) {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      const data = await api("/api/settings", { settings: S.settings });
      S.settings = data.settings; S.app.topics = data.topics; S.app.links = data.links; S.app.link_mode = data.link_mode; S.dirty = false;
      if (S.topic && !data.topics.includes(S.topic)) S.topic = "";
      toast("Settings saved." + (data.relinked ? " The link was updated in " + plural(data.relinked, "draft reply", "draft replies") + "." : ""));
      const y = window.scrollY; render(); window.scrollTo(0, y);
    } catch (e) { fail(e); button.disabled = false; }
  }
  window.addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

  // ---- sign in -----------------------------------------------------------------------------------------
  function loginView() {
    const input = h("input", { type: "password", autocomplete: "current-password", required: true });
    const message = h("div", { class: "inline-note bad" });
    const button = h("button", { class: "btn primary wide", type: "submit", text: "Sign in" });
    const form = h("form", { onsubmit: async e => {
      e.preventDefault(); button.disabled = true; message.textContent = "";
      try { await api("/api/login", { password: input.value }); S.login = false; await start(); }
      catch (err) { message.textContent = err.message; button.disabled = false; input.select(); }
    } }, h("label", { class: "field" }, h("span", { text: "Password" }), input), button, message);
    setTimeout(() => input.focus(), 0);
    return h("div", { class: "login" }, h("div", { class: "panel" }, h("div", { class: "logo", html: LOGO }),
      h("p", { class: "tagline" }, h("span", { class: "grad", text: "Stop guessing. Start running smarter." })), form));
  }
  function lockView() {
    return h("div", { class: "login" }, h("div", { class: "panel" }, h("div", { class: "logo", html: LOGO }),
      h("h2", { text: "One step left" }), h("p", { text: S.lock }),
      h("p", { class: "small", text: "The dashboard stays locked until a password is set, so nobody else can open it." })));
  }

  // ---- draw ---------------------------------------------------------------------------------------------
  function render() {
    root.textContent = "";
    document.body.classList.remove("reading");
    if (S.lock) return root.append(lockView());
    if (S.login) return root.append(loginView());
    if (!S.app) return root.append(h("div", { class: "center", style: "padding:120px" }, h("span", { class: "spin" })));
    const view = S.view === "sources" ? sourcesView() : S.view === "settings" ? settingsView() : inboxView();
    root.append(shell(view));
    if (S.help) root.append(helpSheet());
  }
  async function start() {
    render();
    try { await loadState(); await loadThreads(false); } catch (e) { if (!S.login && !S.lock) fail(e); }
    render();
  }
  // Keep counts fresh without disturbing a reply that is being edited.
  setInterval(async () => {
    if (document.hidden || S.login || S.lock || !S.app || S.scanning || S.help) return;
    const before = S.app.counts.new;
    try { await loadState(); } catch (e) { return; }
    if (S.view !== "inbox" || S.app.counts.new <= before) return;
    toast(plural(S.app.counts.new - before, "new conversation") + " found.", { label: "Show", action: () => { S.tab = "new"; refresh(); } });
  }, 60000);
  start();
})();
</script>
</body>
</html>
