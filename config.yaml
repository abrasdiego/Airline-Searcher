# Airline Searcher configuration. Edit the searches below, commit, and the
# daily GitHub Action will pick up the changes on its next run.

settings:
  provider: serpapi            # serpapi (Google Flights) | duffel | mock (fake data for testing)
  max_requests_per_search: 60  # safety cap on API calls per search per run
  email_subject: Daily flight prices
  history_file: data/history.json

searches:
  - name: Brazil trip
    origin: YYJ                # Victoria, BC
    destination: CNF           # Belo Horizonte (Confins)

    # Leave any day Feb 1–7, 2027 and come back 14 nights later (Feb 15–21).
    window_start: 2027-02-01
    window_end: 2027-02-21
    trip_type: round_trip      # round_trip | one_way
    nights: 14                 # or a range: {min: 12, max: 14}
    return_within_window: true # return flight must also be inside the window

    adults: 1
    cabin: economy             # economy | premium_economy | business | first
    currency: CAD
    # max_stops: 1             # left off: this route usually needs 2 stops
    # max_price: 2500          # hide anything more expensive
    top_n: 5                   # how many of the cheapest options to list

  # Add more routes by repeating the block:
  # - name: Weekend in Paris
  #   origin: LHR
  #   destination: CDG
  #   window_starts_in_days: 30
  #   window_days: 14
  #   trip_type: one_way
